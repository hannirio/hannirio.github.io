<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%">
  <defs>
    <!-- 实线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 L 2 5 z" fill="#222222" />
    </marker>
    <!-- 注释圆点 -->
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="4" markerHeight="4">
      <circle cx="4" cy="4" r="3" fill="#4a90e2" />
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #222222; stroke-width: 2; rx: 4; }
      .process-box { fill: #f4f8fb; stroke: #222222; stroke-width: 2; rx: 4; }
      .line { stroke: #222222; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .note-line { stroke: #4a90e2; stroke-width: 1.2; stroke-dasharray: 4,4; fill: none; marker-start: url(#dot); }
      .note-box { fill: #f9fbfd; stroke: #bce0fd; stroke-width: 1.2; rx: 6; }
      
      .zh { font-family: "SimSun", "Songti SC", "Microsoft YaHei", serif; font-size: 18px; fill: #111111; text-anchor: middle; font-weight: bold; }
      .en { font-family: "Times New Roman", "Arial", sans-serif; font-size: 13px; fill: #444444; text-anchor: middle; }
      
      .desc-title { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 13px; fill: #1a56db; font-weight: bold; }
      .desc-text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 12.5px; fill: #333333; }
      
      .caption-zh { font-family: "SimSun", "Songti SC", "Microsoft YaHei", serif; font-size: 19px; fill: #111111; text-anchor: middle; font-weight: bold; }
      .caption-en { font-family: "Times New Roman", "Arial", sans-serif; font-size: 15px; fill: #333333; text-anchor: middle; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- 主流程节点（中列） -->
  <!-- 1. 源代码 -->
  <rect x="290" y="35" width="190" height="65" class="box" />
  <text x="385" y="63" class="zh">源代码</text>
  <text x="385" y="84" class="en">Source Code</text>

  <!-- 2. 编译器 -->
  <rect x="290" y="155" width="190" height="65" class="process-box" />
  <text x="385" y="183" class="zh">编译器</text>
  <text x="385" y="204" class="en">Compiler</text>

  <!-- 3. 目标代码 -->
  <rect x="290" y="275" width="190" height="65" class="box" />
  <text x="385" y="303" class="zh">目标代码</text>
  <text x="385" y="324" class="en">Object Code</text>

  <!-- 4. 链接程序 -->
  <rect x="290" y="395" width="190" height="65" class="process-box" />
  <text x="385" y="423" class="zh">链接程序</text>
  <text x="385" y="444" class="en">Linker</text>

  <!-- 5. 可执行代码 -->
  <rect x="290" y="515" width="190" height="65" class="box" />
  <text x="385" y="543" class="zh">可执行代码</text>
  <text x="385" y="564" class="en">Executable Code</text>

  <!-- 左侧输入节点 -->
  <!-- 启动代码 -->
  <rect x="35" y="325" width="190" height="65" class="box" />
  <text x="130" y="353" class="zh">启动代码</text>
  <text x="130" y="374" class="en">Startup Code</text>
  <text x="130" y="408" class="desc-text" text-anchor="middle" fill="#555555">* 程序与操作系统的接口代码</text>

  <!-- 库代码 -->
  <rect x="35" y="455" width="190" height="65" class="box" />
  <text x="130" y="483" class="zh">库代码</text>
  <text x="130" y="504" class="en">Library Code</text>
  <text x="130" y="538" class="desc-text" text-anchor="middle" fill="#555555">* 系统提供的标准函数（如 printf）</text>

  <!-- 流程连接箭头 -->
  <line x1="385" y1="100" x2="385" y2="150" class="line" />
  <line x1="385" y1="220" x2="385" y2="270" class="line" />
  <line x1="385" y1="340" x2="385" y2="390" class="line" />
  <line x1="385" y1="460" x2="385" y2="510" class="line" />

  <line x1="225" y1="358" x2="285" y2="412" class="line" />
  <line x1="225" y1="488" x2="285" y2="442" class="line" />

  <!-- 右侧中文讲解框 -->
  <!-- 1. 源代码讲解 -->
  <line x1="480" y1="67" x2="525" y2="67" class="note-line" />
  <rect x="525" y="35" width="320" height="65" class="note-box" />
  <text x="540" y="58" class="desc-title">1. 编写源代码</text>
  <text x="540" y="80" class="desc-text">程序员使用高级语言（如 C/C++）编写的文本文件。</text>

  <!-- 2. 编译器讲解 -->
  <line x1="480" y1="187" x2="525" y2="187" class="note-line" />
  <rect x="525" y="155" width="320" height="65" class="note-box" />
  <text x="540" y="178" class="desc-title">2. 编译阶段</text>
  <text x="540" y="200" class="desc-text">进行语法检查，并将源代码翻译为底层的机器语言。</text>

  <!-- 3. 目标代码讲解 -->
  <line x1="480" y1="307" x2="525" y2="307" class="note-line" />
  <rect x="525" y="275" width="320" height="65" class="note-box" />
  <text x="540" y="298" class="desc-title">3. 生成目标代码</text>
  <text x="540" y="320" class="desc-text">转换后的机器码文件，但尚缺少启动接口与库函数。</text>

  <!-- 4. 链接程序讲解 -->
  <line x1="480" y1="427" x2="525" y2="427" class="note-line" />
  <rect x="525" y="395" width="320" height="65" class="note-box" />
  <text x="540" y="418" class="desc-title">4. 链接阶段</text>
  <text x="540" y="440" class="desc-text">将目标代码、系统的启动代码和引用的库代码合并。</text>

  <!-- 5. 可执行代码讲解 -->
  <line x1="480" y1="547" x2="525" y2="547" class="note-line" />
  <rect x="525" y="515" width="320" height="65" class="note-box" />
  <text x="540" y="538" class="desc-title">5. 生成可执行程序</text>
  <text x="540" y="560" class="desc-text">最终生成的完整二进制文件（如 .exe），可直接运行。</text>

  <!-- 底部图注 -->
  <text x="440" y="645" class="caption-zh">图 1.3  编程步骤与编译链接流程解析</text>
  <text x="440" y="672" class="caption-en">Figure 1.3  Programming Steps and Compilation/Linking Process</text>
</svg>